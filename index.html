<meta name="claude:viewport-fit-sides" content="cover">
<title>Blood Draw Audit</title>
<style>
/* Layout: single-page app, bottom tab bar (New / History / Export), one screen visible at a time.
   Color: clinical teal + ink neutrals; red/amber/green only for compliance signal. */
:root{
  --bg:#F4F7F7; --surface:#FFFFFF; --surface-2:#EAF0F0; --border:#D7E2E2;
  --ink:#16302E; --ink-dim:#5B7472; --accent:#0E7C7B; --accent-ink:#FFFFFF;
  --yes:#1E8E5A; --yes-bg:#E3F5EA; --no:#C4432B; --no-bg:#FBE7E2;
  --na:#7A8B8A; --na-bg:#EAEEED; --warn-bg:#FFF4D6; --warn-ink:#7A5B00;
  --shadow: 0 1px 2px rgba(20,40,38,.06), 0 4px 14px rgba(20,40,38,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1716; --surface:#172422; --surface-2:#1E2D2B; --border:#2B3B38;
    --ink:#E7EFEE; --ink-dim:#9AB0AD; --accent:#43C6B8; --accent-ink:#06211F;
    --yes:#55C487; --yes-bg:#163227; --no:#E8836A; --no-bg:#3A2420;
    --na:#8EA3A0; --na-bg:#23302E; --warn-bg:#3A3215; --warn-ink:#E8C76B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#172422; --surface-2:#1E2D2B; --border:#2B3B38;
  --ink:#E7EFEE; --ink-dim:#9AB0AD; --accent:#43C6B8; --accent-ink:#06211F;
  --yes:#55C487; --yes-bg:#163227; --no:#E8836A; --no-bg:#3A2420;
  --na:#8EA3A0; --na-bg:#23302E; --warn-bg:#3A3215; --warn-ink:#E8C76B;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ans-btn,.chip,.na-toggle,.tab,.linklike,.btn{font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;margin:0;text-align:center}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; min-height:100%;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; margin:0; text-wrap:balance}
.app{flex:1; display:flex; flex-direction:column; max-width:640px; width:100%; margin:0 auto; min-width:0}
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--bg); padding-block:14px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
header.top .brand{display:flex; align-items:center; gap:10px}
header.top .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
header.top .mark svg{width:16px;height:16px}
header.top h1{font-size:17px;color:var(--ink)}
header.top .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.02em}
main{flex:1; padding-bottom:92px; min-width:0}
.screen{display:none; padding-block:4px 20px}
.screen.active{display:block}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px}
.field input[type=text], .field input[type=time], .field input[type=date], .field input[type=number], .field textarea, .field select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); font-size:15px; font-family:inherit;
}
.field textarea{min-height:60px; resize:vertical}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.chip-group{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; user-select:none;
}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 0 10px}
.section-head h2{font-size:18px}
.section-head .pct{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; padding:3px 9px; border-radius:999px}
.section-sub{font-size:12px; color:var(--ink-dim); font-style:italic; margin:-6px 0 10px}
.item{border-top:1px solid var(--border); padding:13px 0}
.item:first-child{border-top:none; padding-top:2px}
.item .text{font-size:14.5px; line-height:1.4; margin-bottom:10px}
.item .idtag{font-size:11px; font-weight:700; color:var(--accent); margin-right:6px}
.ans-group{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.ans-btn{
  padding:9px 4px; text-align:center; border-radius:9px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink-dim); font-size:13px; font-weight:700; cursor:pointer; min-width:0;
}
.ans-btn.sel-Yes{background:var(--yes-bg); color:var(--yes); border-color:var(--yes)}
.ans-btn.sel-No{background:var(--no-bg); color:var(--no); border-color:var(--no)}
.ans-btn.sel-N-O, .ans-btn.sel-N-A{background:var(--na-bg); color:var(--na); border-color:var(--na)}
.ans-group input[type=radio]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ans-btn:has(input[value="Yes"]:checked){background:var(--yes-bg); color:var(--yes); border-color:var(--yes)}
.ans-btn:has(input[value="No"]:checked){background:var(--no-bg); color:var(--no); border-color:var(--no)}
.ans-btn:has(input[value="N/O"]:checked), .ans-btn:has(input[value="N/A"]:checked){background:var(--na-bg); color:var(--na); border-color:var(--na)}
.note-flag{margin-top:10px}
.note-flag input{width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--no); background:var(--no-bg); color:var(--ink); font-size:13.5px}
.volume-row{display:flex; gap:10px; align-items:center}
.volume-row .field{flex:1; margin-bottom:0}
.sec-note{margin-top:14px}
.sec-note label{font-size:12px; color:var(--ink-dim); font-weight:600}
.sec-note textarea{width:100%; margin-top:6px}
.summary-bar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden}
.summary-bar > div{height:100%; border-radius:999px}
.save-bar{position:sticky; bottom:0; padding-block:12px calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top, var(--bg) 70%, transparent)}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; border-radius:12px;
  background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:700; border:none; cursor:pointer;
}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--border)}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; color:var(--ink-dim); cursor:pointer; font-size:11px; font-weight:600}
.tab.active{color:var(--accent)}
.tab svg{width:21px;height:21px}
.obs-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 0; border-top:1px solid var(--border); cursor:pointer; touch-action:manipulation}
.obs-row:first-child{border-top:none}
.obs-row .meta{min-width:0}
.obs-row .meta .d{font-weight:700; font-size:14.5px}
.obs-row .meta .s{font-size:12.5px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill{font-weight:700; font-size:13px; padding:4px 10px; border-radius:999px; font-variant-numeric:tabular-nums; flex-shrink:0}
.pill.good{background:var(--yes-bg); color:var(--yes)}
.pill.bad{background:var(--no-bg); color:var(--no)}
.pill.mid{background:var(--warn-bg); color:var(--warn-ink)}
.empty{text-align:center; padding:50px 20px; color:var(--ink-dim)}
.empty h3{color:var(--ink); margin-bottom:8px; font-size:17px}
.toast{
  position:fixed; bottom:calc(76px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:30; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.stat .n{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; font-family:'Fraunces',serif}
.stat .l{font-size:11.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:2px}
.secbar-row{display:flex; align-items:center; gap:10px; padding:8px 0}
.secbar-row .lab{width:30px; font-weight:700; font-size:13px; flex-shrink:0}
.secbar-row .track{flex:1; height:9px; border-radius:999px; background:var(--surface-2); overflow:hidden}
.secbar-row .track > div{height:100%; border-radius:999px; background:var(--accent)}
.secbar-row .val{width:44px; text-align:right; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0}
select#targetPct{width:auto; display:inline-block; padding:6px 8px}
.linklike{color:var(--accent); font-weight:600; font-size:13.5px; background:none; border:none; padding:0; cursor:pointer}
.formula-note{font-size:12px; color:var(--ink-dim); line-height:1.5; margin-top:4px}
.table-wrap{overflow-x:auto; margin-top:4px; -webkit-overflow-scrolling:touch}
.mtable{width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums}
.mtable th,.mtable td{padding:7px 9px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--border)}
.mtable th{color:var(--ink-dim); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em}
.mtable td:first-child,.mtable th:first-child{text-align:left}
.mtable tbody tr:last-child td{border-bottom:none}
.hbar-row{display:flex; align-items:center; gap:10px; padding:7px 0}
.hbar-row .lab{width:150px; flex-shrink:0; font-size:12.5px; line-height:1.3}
.hbar-row .lab .id{font-weight:700; color:var(--accent); margin-right:4px}
.hbar-row .track{flex:1; height:16px; border-radius:6px; background:var(--surface-2); overflow:hidden; min-width:0}
.hbar-row .track > div{height:100%; border-radius:6px; background:var(--no)}
.hbar-row .val{width:30px; text-align:right; font-size:12.5px; font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums}
.nursecard{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--border)}
.nursecard:first-child{border-top:none}
.nursecard .who{font-weight:700; font-size:14px}
.nursecard .cnt{font-size:12px; color:var(--ink-dim)}
.card.na{opacity:.45; filter:grayscale(.6)}
.card.na .item, .card.na .sec-note{pointer-events:none}
.na-toggle{padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-dim); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap}
.na-toggle.on{background:var(--na); color:var(--surface); border-color:var(--na)}
.section-head{cursor:pointer;touch-action:manipulation}
.section-head h2{display:flex; align-items:center; gap:7px}
.chev{display:inline-block; transition:transform .18s; flex-shrink:0; color:var(--ink-dim)}
.chev.collapsed{transform:rotate(-90deg)}
.card.collapsed-body{display:none}
.drawsummary{font-size:12.5px; color:var(--ink-dim); margin:2px 0 16px}
.drawsummary b{color:var(--ink)}
.segwrap{display:flex; height:10px; border-radius:999px; overflow:hidden; width:120px; background:var(--surface-2); flex-shrink:0}
.tabbar .tab{flex:1}
</style>

<div class="app">
<header class="top">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 4 6 7.5 6 11a6 6 0 1 1-12 0c0-3.5 3-7 6-11z"/></svg></div>
    <div><h1 id="pageTitle">New Observation</h1><div class="sub">Blood Draw &amp; Culture Audit</div></div>
  </div>
  <button class="linklike" id="newBtn" hidden>+ New</button>
</header>

<main>
  <section class="screen active" id="screen-new"></section>
  <section class="screen" id="screen-history"></section>
  <section class="screen" id="screen-insights"></section>
  <section class="screen" id="screen-export"></section>
</main>
</div>

<div class="tabbar">
  <button type="button" class="tab active" data-tab="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New</button>
  <button type="button" class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-7 3L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg>History</button>
  <button type="button" class="tab" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M11 19V5M18 19v-7"/></svg>Insights</button>
  <button type="button" class="tab" data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Checklist model (mirrors the paper audit tool) ===================== */
const DRAW_TYPES = [
  { id:'bloods', label:'Bloods' },
  { id:'cultures', label:'Blood Cultures' },
  { id:'cbg', label:'CBG' }
];
const CHECKLIST = [
  { id:'A', title:'Pre-Procedure Preparation & Supplies', sub:'Routine Bloods / Blood Culture — trolley-based', applies:['bloods','cultures'], items:[
    {id:'A1',text:'Trolley cleaned before preparation'},
    {id:'A2',text:'Blood collected in Salama before entering the room'},
    {id:'A3',text:'Sunquest scanner taken to bedside'},
    {id:'A4',text:'Zebra printer taken to bedside'},
    {id:'A5',text:'Biohazard transport bag taken to bedside'},
    {id:'A6',text:'Date written on the IV cannula dressing outside'},
    {id:'A7',text:'Ivy extension flushed and left in the original package'},
    {id:'A8',text:'Emesis basin and label carried for VBG'}
  ]},
  { id:'B', title:'Regular Blood Collection', applies:['bloods'], items:[
    {id:'B1',text:'Hand hygiene performed before entering the room or before donning gloves'},
    {id:'B2',text:'Nurse introduced themself (if first contact) and / or explained the procedure'},
    {id:'B3',text:'Gloves worn inside the room'},
    {id:'B4',text:'Patient identity confirmed using at least two identifiers'},
    {id:'B5',text:'Aseptic non-touch technique maintained throughout'},
    {id:'B6',text:'Chlorhexidine caps applied to IV extension'}
  ]},
  { id:'C', title:'Blood Culture — Sterile Technique', applies:['cultures'], items:[
    {id:'C1',text:'Hand hygiene performed before entering the room'},
    {id:'C1a',text:'Hand hygiene performed before donning sterile gloves'},
    {id:'C2',text:'Nurse introduced themself (if first contact) and / or explained the procedure'},
    {id:'C3',text:'Patient identity confirmed using at least two identifiers'},
    {id:'C4',text:'Sterile gloves donned correctly'},
    {id:'C5a',text:'Baby wipe used to clean skin prior to antisepsis'},
    {id:'C5',text:'Chlorhexidine stick applied to skin using back-and-forth friction for a MINIMUM of 30 seconds'},
    {id:'C6',text:'Site allowed to dry completely before puncture (no fanning, wiping, or blowing on the site)'},
    {id:'C7',text:'Sterile technique maintained throughout the procedure'},
    {id:'C8',text:'Prepped site NOT re-palpated after antisepsis (or sterile glove used if palpation unavoidable)'},
    {id:'C8a',text:'Number of cannulation attempts', type:'count'},
    {id:'C9',text:'Volume of blood collected for each blood culture bottle (mL)', type:'volume'},
    {id:'C10',text:'Chlorhexidine caps applied to IV extension'},
    {id:'C11',text:'Blood culture collection site', type:'site'}
  ]},
  { id:'D', title:'Post-Procedure (Routine Bloods & Blood Culture)', applies:['bloods','cultures'], items:[
    {id:'D1',text:'Labels attached to the tube(s), post-procedure, inside the room'},
    {id:'D2',text:'Labelled tube(s) placed into the biohazard bag'},
    {id:'D3',text:'Assisting nurse for VBG removed gloves in the room'},
    {id:'D4',text:'Used items thrown away in correct bin in the room'},
    {id:'D5',text:'Sharps discarded in sharp box'},
    {id:'D6',text:'Visible blood stains cleaned'},
    {id:'D7',text:'Gloves removed inside the room and discarded in yellow bin'},
    {id:'D8',text:'Next steps explained to patient / family (e.g., waiting time, what happens next)'},
    {id:'D9',text:'Hand hygiene performed when exiting room'}
  ]},
  { id:'E', title:'Post-Procedure Exit', sub:'Routine Bloods / Blood Culture — trolley-based', applies:['bloods','cultures'], items:[
    {id:'E1',text:'All unused / opened items removed from the trolley (no clutter left behind)'},
    {id:'E2',text:'Trolley surfaces wiped / disinfected after the procedure'}
  ]},
  { id:'F', title:'CBG Collection', applies:['cbg'], items:[
    {id:'F1',text:'CBG supplies carried in an emesis basin'},
    {id:'F2',text:'Hand hygiene performed before entering the room or before touching the patient'},
    {id:'F3',text:'Nurse introduced themself (if first contact) and / or explained the procedure'},
    {id:'F4',text:'Gloves removed in the room'}
  ]}
];
const ANSWERS = ['Yes','No','N/O','N/A'];
const SITES = ['CVC','Port','PIV','Butterfly'];
const SCORED_ITEMS = CHECKLIST.flatMap(s=>s.items.filter(i=>!i.type));
const TOTAL_SCORED = SCORED_ITEMS.length;

const TOGGLEABLE_SECTIONS = ['B','C','F']; // only the draw-type-specific sections can be marked N/A; A/D/E always apply
function sectionApplies(sec,o){
  if(!TOGGLEABLE_SECTIONS.includes(sec.id)) return true;
  return !(o && o.naSections && o.naSections[sec.id]);
}
function drawLabel(o){
  const parts=[];
  if(sectionApplies(CHECKLIST[1],o)) parts.push('Bloods');
  if(sectionApplies(CHECKLIST[2],o)) parts.push('Blood Cultures');
  if(sectionApplies(CHECKLIST[5],o)) parts.push('CBG');
  return parts.length ? parts.join(' + ') : '—';
}
function pctOf(r){ return (r.yes+r.no) ? r.yes/(r.yes+r.no) : null; }
function scoreObs(o){
  const tot={yes:0,no:0,nobs:0,na:0,open:0,sections:{}};
  for(const s of CHECKLIST){
    const app=sectionApplies(s,o);
    const r={yes:0,no:0,nobs:0,na:0,open:0,applicable:app};
    for(const it of s.items){
      if(it.type) continue;
      const a=app ? ((o.answers||{})[it.id]||'') : 'N/A';
      if(a==='Yes') r.yes++; else if(a==='No') r.no++;
      else if(a==='N/O') r.nobs++; else if(a==='N/A') r.na++; else r.open++;
    }
    r.pct=pctOf(r); tot.sections[s.id]=r;
    for(const k of ['yes','no','nobs','na','open']) tot[k]+= app?r[k]:0;
  }
  tot.pct=pctOf(tot);
  return tot;
}
function sortObs(list){
  return [...list].sort((a,b)=>
    (a.date||'').localeCompare(b.date||'') ||
    (a.startTime||'').localeCompare(b.startTime||'') ||
    (a.createdAt||'').localeCompare(b.createdAt||''));
}
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }

// ExcelJS is only needed for the Export tab's download button, so it's loaded on demand —
// the checklist itself never waits on this external script or on network access.
let _exceljsLoad = null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(_exceljsLoad) return _exceljsLoad;
  _exceljsLoad = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _exceljsLoad = null; reject(new Error('exceljs failed to load')); };
    document.head.appendChild(s);
  });
  return _exceljsLoad;
}

/* ===================== Excel workbook builder (same layout as the paper score sheet) ===================== */
function buildWorkbook(obsInput, target){
  const obsList = sortObs(obsInput);
  target = typeof target==='number' ? target : 0.9;
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Blood Draw Audit app';
  wb.calcProperties.fullCalcOnLoad = true;
  const N = Math.max(30, obsList.length+10);
  const C0=4, CL=C0+N-1, LC=colLetter(CL);
  const fill = argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});
  const F = {title:'FF0F4C5C',sec:'FFD9E7EA',sub:'FFEFF5F6',input:'FFFFF7D6',auto:'FFE3EEF8',head:'FF244B57',note:'FFFAFAF7'};
  const thin={style:'thin',color:{argb:'FFC9D3D6'}};
  const border={top:thin,left:thin,bottom:thin,right:thin};

  r++;

  for(const s of CHECKLIST){

          for(let i=0;i<N;i++){

    {type:'cellIs',operator:'equal',formulae:['"Below target"'],style:fillDx('FFFFC7CE','FF9C0006'),priority:8}

  const sm = wb.addWorksheet('Summary by Date');

  sm.getRow(1).height=24;

  const widths=[6,13,18,20,18,9,9,9,9,9,9,16,11,14];

  const AD="'Audit Data'!";
  const link=(L,row)=>`IF(${AD}${L}${row}="","",${AD}${L}${row})`;
  const allRowIdx=4;
  const writeSumRow=(row,L,label)=>{

  for(let c=1;c<=14;c++) sm.getRow(allRowIdx).getCell(c).fill=fill(F.sec);

  const T2=`'Audit Data'!${T}`;

  sm.addConditionalFormatting({ref:`N4:N${smEnd}`,rules:[
    {type:'cellIs',operator:'equal',formulae:['"Target met"'],style:fillDx('FFC6EFCE','FF0B5D1E'),priority:1},

  ]});
  sm.views=[{state:'frozen',ySplit:3}];
  return wb;
}

/* ===================== App state & persistence (artifact capability) ===================== */
let OBS = [];           // all saved observations
let DRAFT = null;        // current in-progress observation (new or being edited)
let TARGET = 0.9;
let artifactCap = null;
let canWrite = true;
let collapsedSections = {}; // UI-only: which section cards are collapsed (not persisted)

function uid(){ return 'obs-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }
function emptyDraft(){
  return {
    id: uid(), date: new Date().toISOString().slice(0,10), startTime:'', finishTime:'',
    unit:'Emergency Department', location:'', observer:'Violetta', mrn:'', naSections:{},
    trolleyPrep:'', cannulating:'', assisting:'', trolleyCleaned:'',
    answers:{}, vol1:'', vol2:'', site:'', notes:{}, nonCompliance:'', feedback:'',
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
}

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-'); const dt=new Date(Date.UTC(+y,+m-1,+d));
  return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function pctLabel(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }
function pillClass(p){ if(p===null) return 'mid'; return p>=TARGET ? 'good' : (p>=0.6 ? 'mid' : 'bad'); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---- doc-rebuild helper for artifact.publish(): regenerate the whole page from state ---- */
function serializeState(){
  return { obs: OBS, target: TARGET };
}
function currentDocHTML(){
  const styleEl = document.querySelector('style').outerHTML;
  const titleEl = document.querySelector('title').outerHTML;
  const metaEl = document.querySelector('meta[name="claude:viewport-fit-sides"]').outerHTML;
  // Strip every previous seed-data tag (however many piled up) before appending one fresh copy.
  const bodyInner = document.body.innerHTML.replace(/<script id="seed-data"[^>]*>[\s\S]*?<\/script>/g, '');
  const closeTag = '<' + '/script>';
  const safeJson = JSON.stringify(serializeState()).split('<' + '/script').join('<\\/script');
  const dataScript = '<script id="seed-data" type="application/json">' + safeJson + closeTag;
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">${metaEl}${titleEl}${styleEl}</head><body>${bodyInner}${dataScript}</body></html>`;
}
/* ---- Standalone (non-Claude, e.g. GitHub Pages) persistence fallback.
   When this page is NOT running inside a Claude artifact, `claude` is
   undefined and claude.use('artifact') is never available — so every save
   must go to localStorage instead, or nothing is durable and a refresh
   silently wipes whatever was entered. ---- */
const LOCAL_KEY = 'blood-audit-app-state-v1';
function saveLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(serializeState())); }
  catch(e){ console.error('localStorage save failed', e); toast('Could not save — storage unavailable'); }
}
function loadLocal(){
  try{ const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function persist(){
  if(!artifactCap){ saveLocal(); return; }
  if(!canWrite){ saveLocal(); return; }
  try{ await artifactCap.publish(currentDocHTML()); }
  catch(e){
    if(e && e.code==='conflict'){ /* another view saved; it will reload */ }
    else if(e && (e.code==='not_granted'||e.code==='not_writer')){ canWrite=false; saveLocal(); }
    else { saveLocal(); } // any other publish failure: still keep a local copy rather than lose the data
  }
}

function scoreOverall(list){
  let yes=0,no=0;
  for(const o of list){ const s=scoreObs(o); yes+=s.yes; no+=s.no; }
  return (yes+no) ? yes/(yes+no) : null;
}

/* ===================== Insights screen ===================== */
function itemLookup(id){ for(const s of CHECKLIST){ for(const it of s.items){ if(it.id===id) return it; } } return null; }

/* ---- Monthly progress: group observations by calendar month, score each month
   the same way as the overall score (Yes / (Yes+No), weighted by item count —
   not a plain average of per-observation percentages). ---- */
function monthKey(o){ return (o.date||'').slice(0,7) || 'unknown'; }
function monthShortLabel(key){
  if(key==='unknown') return '—';
  const [y,m] = key.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,1)).toLocaleDateString(undefined,{month:'short',year:'2-digit'});
}
function monthFullLabel(key){
  if(key==='unknown') return 'Unknown month';
  const [y,m] = key.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,1)).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function computeMonthly(list){
  const groups = {};
  for(const o of list){ const k=monthKey(o); (groups[k]=groups[k]||[]).push(o); }
  return Object.keys(groups).sort().map(k=>{
    const obsIn = groups[k];
    let yes=0,no=0;
    const secTot = {}; CHECKLIST.forEach(s=>secTot[s.id]={yes:0,no:0});
    for(const o of obsIn){
      const sc = scoreObs(o);
      yes += sc.yes; no += sc.no;
      for(const s of CHECKLIST){
        const r = sc.sections[s.id];
        if(r.applicable){ secTot[s.id].yes += r.yes; secTot[s.id].no += r.no; }
      }
    }
    const sections = {};
    CHECKLIST.forEach(s=>{ const t=secTot[s.id]; sections[s.id] = (t.yes+t.no) ? t.yes/(t.yes+t.no) : null; });
    return { key:k, label: monthFullLabel(k), shortLabel: monthShortLabel(k), n: obsIn.length,
      pct: (yes+no) ? yes/(yes+no) : null, sections };
  });
}
/* Bar chart of overall score per month — renders immediately with just one
   month's worth of data (a single bar), unlike a line which needs 2+ points.
   Once 2+ months exist, a thin connecting line is drawn across the bar tops
   so the same chart doubles as the progression view as more data comes in. */
function renderMonthlyChart(rows){
  const plotRows = rows.filter(r=>r.pct!==null);
  if(!plotRows.length) return '';
  const W=600,H=200,padL=38,padR=14,padT=22,padB=34;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = plotRows.length;
  const gap = n>1 ? 14 : 0;
  const barW = Math.min(64, (innerW - gap*(n-1))/n);
  const rowStartX = padL + Math.max(0, (innerW - (n*barW + gap*(n-1)))/2);
  const xCenter = i => rowStartX + i*(barW+gap) + barW/2;
  const yOf = v => padT + (1-v)*innerH;
  const baseY = padT+innerH;
  const targetY = yOf(Math.min(Math.max(TARGET,0),1));
  const bars = plotRows.map((r,i)=>{
    const bx = xCenter(i)-barW/2, by = yOf(r.pct), bh = baseY-by;
    const color = r.pct>=TARGET ? 'var(--yes)' : 'var(--no)';
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="4" fill="${color}"><title>${r.label}: ${pctLabel(r.pct)} (${r.n} observation${r.n===1?'':'s'})</title></rect>
     <text x="${xCenter(i).toFixed(1)}" y="${(by-7).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${pctLabel(r.pct)}</text>`;
  }).join('');
  const trendLine = n>=2 ? `<polyline points="${plotRows.map((r,i)=>`${xCenter(i).toFixed(1)},${(yOf(r.pct)-13).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>` : '';
  const labels = plotRows.map((r,i)=>`<text x="${xCenter(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="9" fill="var(--ink-dim)">${r.shortLabel}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Overall compliance score by month, target ${pctLabel(TARGET)}">
    <line x1="${padL}" x2="${W-padR}" y1="${baseY}" y2="${baseY}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${padL}" x2="${W-padR}" y1="${targetY.toFixed(1)}" y2="${targetY.toFixed(1)}" stroke="var(--na)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="${padL-6}" y="${(targetY+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-dim)">${pctLabel(TARGET)}</text>
    ${trendLine}
    ${bars}
    ${labels}
  </svg>`;
}
/* ---- Answer breakdown donut: Yes/No/N/A/N/O across every applicable item in
   every saved observation. Renders the moment there's one observation — no
   waiting on history to build up. Reuses the same status colors as the rest
   of the app (yes=green, no=red, n/a=gray, n/o=amber) for consistency. ---- */
function aggregateAnswers(list){
  let yes=0,no=0,na=0,nobs=0;
  for(const o of list){
    for(const s of CHECKLIST){
      const app = sectionApplies(s,o);
      for(const it of s.items){
        if(it.type) continue;
        const a = app ? ((o.answers||{})[it.id]||'') : 'N/A';
        if(a==='Yes') yes++; else if(a==='No') no++; else if(a==='N/O') nobs++; else if(a==='N/A') na++;
      }
    }
  }
  return {yes,no,na,nobs};
}
function renderAnswerDonut(agg){
  const segments = [
    {label:'Yes', value:agg.yes, color:'var(--yes)'},
    {label:'No', value:agg.no, color:'var(--no)'},
    {label:'N/A', value:agg.na, color:'var(--na)'},
    {label:'N/O', value:agg.nobs, color:'var(--warn-ink)'}
  ];
  const total = segments.reduce((a,s)=>a+s.value,0);
  if(!total) return '<p class="formula-note">No answered items yet.</p>';
  const r=62, cx=84, cy=84, sw=24, C=2*Math.PI*r;
  let acc=0;
  const arcs = segments.filter(s=>s.value>0).map(s=>{
    const frac = s.value/total;
    const len = frac*C;
    const rotate = -90 + (acc/total)*360;
    acc += s.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" transform="rotate(${rotate.toFixed(2)} ${cx} ${cy})"><title>${s.label}: ${s.value} (${Math.round(frac*100)}%)</title></circle>`;
  }).join('');
  const yesFrac = Math.round((agg.yes/total)*100);
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg viewBox="0 0 168 168" style="width:140px;height:140px;flex-shrink:0" role="img" aria-label="Breakdown of all answers: Yes, No, N/A, N/O">
      ${arcs}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">${yesFrac}%</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">Yes</text>
    </svg>
    <div style="flex:1;min-width:130px">
      ${segments.filter(s=>s.value>0).map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px">
        <span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0"></span>
        <span style="flex:1;color:var(--ink)">${s.label}</span>
        <span style="font-weight:700;color:var(--ink-dim)">${s.value} (${Math.round(s.value/total*100)}%)</span>
      </div>`).join('')}
    </div>
  </div>`;
}
function renderMonthlyTable(rows){
  return `<div class="table-wrap"><table class="mtable">
    <thead><tr><th>Month</th><th>Obs</th>${CHECKLIST.map(s=>`<th>${s.id}</th>`).join('')}<th>Overall</th><th>vs Target</th></tr></thead>
    <tbody>${rows.map(r=>{
      const met = r.pct===null ? null : r.pct>=TARGET;

        <td>${r.shortLabel}</td>
        <td>${r.n}</td>

        <td style="font-weight:700;color:${r.pct===null?'var(--ink-dim)':r.pct>=TARGET?'var(--yes)':'var(--no)'}">${pctLabel(r.pct)}</td>

      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}
function renderInsights(){
  const el = document.getElementById('screen-insights');
  if(!OBS.length){
    el.innerHTML = `<div class="empty"><h3>Nothing to show yet</h3><p>Save a few observations and this tab will chart the most common misses and compliance by nurse.</p></div>`;
    return;
  }
  const monthly = computeMonthly(OBS);
  const answerAgg = aggregateAnswers(OBS);
  // Most common non-compliance: count of "No" per item across all applicable observations
  const noCounts = {};
  for(const o of OBS){
    for(const s of CHECKLIST){
      if(!sectionApplies(s,o)) continue;
      for(const it of s.items){
        if(it.type) continue;
        if((o.answers||{})[it.id]==='No') noCounts[it.id]=(noCounts[it.id]||0)+1;
      }
    }
  }
  const topMisses = Object.entries(noCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxMiss = topMisses.length ? topMisses[0][1] : 1;

  // Compliance % per primary (cannulating) nurse
  const byNurse = {};
  for(const o of OBS){
    const name = (o.cannulating || '').trim() || 'Unassigned';
    const sc = scoreObs(o);
    if(!byNurse[name]) byNurse[name] = {yes:0,no:0,n:0};
    byNurse[name].yes += sc.yes; byNurse[name].no += sc.no; byNurse[name].n += 1;
  }
  const nurseRows = Object.entries(byNurse)
    .map(([name,v])=>({name, n:v.n, pct:(v.yes+v.no)?v.yes/(v.yes+v.no):null}))
    .sort((a,b)=> (b.pct??-1)-(a.pct??-1));

  // Compliance by section, worst-first (reuse history calc logic but sorted)
  const bySection = CHECKLIST.map(s=>{
    const vals = OBS.map(o=>scoreObs(o).sections[s.id]).filter(r=>r.applicable && r.pct!==null);
    const avg = vals.length ? vals.reduce((a,b)=>a+b.pct,0)/vals.length : null;
    return {id:s.id, title:s.title, pct:avg};
  }).filter(s=>s.pct!==null).sort((a,b)=>a.pct-b.pct);

  el.innerHTML = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;font-family:inherit">Monthly progress</h3>
      <p class="formula-note" style="margin-bottom:10px">Overall score by month (Yes ÷ Yes+No across all that month's observations), dashed line = ${pctLabel(TARGET)} target${monthly.length>=2 ? '. Faint line across the bars tracks the trend as more months come in.' : ''}</p>
      ${renderMonthlyChart(monthly)}
      ${renderMonthlyTable(monthly)}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;font-family:inherit">Answer breakdown</h3>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;font-family:inherit">Compliance by nurse</h3>
      <p class="formula-note" style="margin-bottom:10px">Based on the cannulating nurse on each observation.</p>
      ${nurseRows.map(n=>`<div class="nursecard">

          <div class="segwrap"><div style="width:${n.pct===null?0:Math.round(n.pct*100)}%;background:${n.pct===null?'var(--na)':n.pct>=TARGET?'var(--yes)':n.pct>=0.6?'var(--warn-ink)':'var(--no)'}"></div></div>
          <span class="pill ${pillClass(n.pct)}">${pctLabel(n.pct)}</span>
        </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;font-family:inherit">Weakest sections</h3>

}

/* ===================== Export screen ===================== */
function renderExport(){
  const el = document.getElementById('screen-export');
  el.innerHTML = `
    <div class="card">
      <div class="field"><label>Compliance target</label>
        <select id="targetPct">
          ${[0.8,0.85,0.9,0.95,1].map(v=>`<option value="${v}" ${Math.abs(v-TARGET)<0.001?'selected':''}>${Math.round(v*100)}%</option>`).join('')}
        </select>
      </div>
      <div class="formula-note">Used for the "Target met / Below target" column in the exported sheet.</div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:8px;font-family:inherit">Download as Excel</h3>
      <p class="formula-note" style="margin-bottom:14px">Builds the same layout as the paper score sheet — Audit Data + Summary by Date — with ${OBS.length} observation${OBS.length===1?'':'s'}, formulas and conditional colors included.</p>
      <button class="btn" id="exportBtn">${OBS.length ? 'Download .xlsx' : 'No observations to export yet'}</button>
    </div>
  `;
  document.getElementById('targetPct').onchange=(e)=>{ TARGET=parseFloat(e.target.value); persist(); };
  const btn=document.getElementById('exportBtn');
  if(!OBS.length){ btn.disabled=true; return; }
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent='Loading Excel engine...';
    try{
      await loadExcelJS();
      btn.textContent='Building...';
      const wb = buildWorkbook(OBS, TARGET);
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const name = `Blood_Collection_Audit_Score_Sheet_${new Date().toISOString().slice(0,10)}.xlsx`;
      if(typeof claude !== 'undefined' && claude && claude.use){
        const dl = await claude.use('downloads');
        if(dl){ await dl.save({filename:name, data:blob}); toast('Downloaded'); }
        else { toast('Downloads unavailable in this view'); }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
        toast('Downloaded');
      }
    }catch(e){ console.error(e); toast('Could not build the file'); }
    btn.disabled=false; btn.textContent='Download .xlsx';
  };
}

/* ===================== Tabs ===================== */
function setTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id==='screen-'+name));
  if(name==='new'){ document.getElementById('pageTitle').textContent = DRAFT && OBS.find(o=>o.id===DRAFT.id) ? 'Edit Observation' : 'New Observation'; renderNew(); }
  if(name==='history') renderHistory();
  if(name==='insights') renderInsights();
  if(name==='export') renderExport();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
document.getElementById('newBtn').onclick=()=>{
  DRAFT=emptyDraft();
  document.getElementById('pageTitle').textContent='New Observation';
  document.getElementById('newBtn').hidden=true;
  renderNew();
};

function bootFromState(state){
  OBS = (state && state.obs) || INITIAL_OBS.slice();
  TARGET = (state && typeof state.target==='number') ? state.target : 0.9;
  DRAFT = emptyDraft();
  setTab('new');
}
function readSeed(){
  // Only the very first published copy has zero seed tags; from then on there is always
  // exactly one (duplicates are stripped on save). Treat "tag present but unparsable" as
  // a one-off read problem, never as a reason to auto-save again — that was the loop bug.
  const nodes = document.querySelectorAll('#seed-data');
  if(!nodes.length) return { hadTag:false, state:null };
  try{ return { hadTag:true, state: JSON.parse(nodes[0].textContent) }; }
  catch(e){ return { hadTag:true, state:null }; }
}
(async function init(){
  if(typeof claude === 'undefined' || !claude || !claude.use){
    // Not running inside a Claude artifact (e.g. hosted standalone on GitHub Pages) —
    // load from this browser's localStorage instead of the artifact seed tag.
    const saved = loadLocal();
    bootFromState(saved || { obs: INITIAL_OBS.slice(), target: 0.9 });
    if(!saved) saveLocal(); // first-ever load on this device: write the seeded observations so they stick
    return;
  }
  const seed = readSeed();
  bootFromState(seed.state);
  try{
    artifactCap = await claude.use('artifact');
    if(!seed.hadTag) await persist(); // true first-ever load: write the seeded observations so they stick
  }catch(e){ artifactCap = null; saveLocal(); }
})();
